<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Garden Water Billing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17201d;--mute:#66736e;--line:#e1e6e3;--pri:#0f5c4d;--pri2:#e5f1ee;--red:#b3261e;--red2:#fbe9e7;--amb:#a15c00;--amb2:#fff3dc;--grn:#1b7a3d;--grn2:#e3f4e8;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--pri);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:18px;font-weight:650;display:flex;align-items:center;gap:8px;justify-content:space-between}
.top .btn{color:var(--ink);background:#fff}
.top small{opacity:.8;font-weight:400;font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#cfe5df;padding:9px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-weight:550}
.tab.on{color:#fff;border-color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:#b9c6c1}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.red{color:var(--red);border-color:#efc6c2}
.btn.grn{background:#1f8f4c;border-color:#1f8f4c;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=month],input[type=password],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #8cc5b7;border-color:var(--pri)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#fafcfb}
.hno{min-width:52px;height:40px;border-radius:9px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 6px}
.item .m{flex:1;min-width:0}
.item .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m small{color:var(--mute)}
.amt{font-variant-numeric:tabular-nums;font-weight:650;text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.b-paid{background:var(--grn2);color:var(--grn)}
.b-unpaid{background:var(--red2);color:var(--red)}
.b-part{background:var(--amb2);color:var(--amb)}
.b-carried{background:#eceff1;color:#546e7a}
.b-sold{background:var(--pri2);color:var(--pri)}
.b-no{background:#eceff1;color:#78858a}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.note{background:var(--amb2);color:#5c3b00;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.info{background:var(--pri2);color:#0c4a3e;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.err{background:var(--red2);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.muted{color:var(--mute)}
.bar{height:8px;background:#e6ecea;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.empty{padding:30px;text-align:center;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media(min-width:700px){.modal{align-items:center}}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:700px){.sheet{border-radius:16px}}
.sheet.wide{max-width:760px}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.x{margin-left:auto;border:0;background:#f0f3f2;border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17201d;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90vw}
#toast.on{opacity:1}
.big{font-size:30px;font-weight:700;text-align:center;padding:14px;letter-spacing:1px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.preview{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.boot{padding:60px 20px;text-align:center;color:var(--mute)}
.qrprev{width:140px;height:140px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--mute);font-weight:600;font-size:12px}
.pinbox{max-width:360px;margin:50px auto}
</style>
</head>
<body>
<div id="app"><div class="boot">Load ho raha hai…</div></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const money = n => "Rs " + (Math.round(n) || 0).toLocaleString("en-PK");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const curMonth = () => todayISO().slice(0, 7);
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const fmtDate = iso => iso ? iso.slice(8, 10) + "-" + iso.slice(5, 7) + "-" + iso.slice(0, 4) : "";
const EN_M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const UR_M = ["جنوری", "فروری", "مارچ", "اپریل", "مئی", "جون", "جولائی", "اگست", "ستمبر", "اکتوبر", "نومبر", "دسمبر"];
const mLabel = m => m ? EN_M[+m.slice(5, 7) - 1] + " " + m.slice(0, 4) : "";
const mUr = m => UR_M[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const prevMonthKey = m => { let y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1; if (mo === 0) { y--; mo = 12; } return y + "-" + pad(mo); };
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function waPhone(p) { let d = String(p || "").trim().split(/[\s,\/]+(?=[0+9])/)[0].replace(/\D/g, ""); if (!d) return ""; if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("920") && d.length === 13) d = "92" + d.slice(3); if (d.startsWith("0")) d = "92" + d.slice(1); else if (d.length === 10 && d.startsWith("3")) d = "92" + d; return d; }
function parseRanges(t) { const out = new Set(); String(t || "").split(/[,\s]+/).forEach(p => { if (!p) return; const m = p.match(/^(\d+)-(\d+)$/); if (m) { for (let i = +m[1]; i <= +m[2] && i - +m[1] < 5000; i++) out.add(String(i)); } else if (/^\d+$/.test(p)) out.add(String(+p)); }); return out; }

const DEF = { name: "Royal Garden", nameUr: "رائل گارڈن", address: "", phone: "", marlaRate: 250, unitRate: 0, fineDefault: 0, dueDays: 10, jazzNumber: "", jazzTitle: "", bankName: "", bankTitle: "", bankAcc: "", iban: "", qr: "", readerPin: "1234", adminPin: "" };

/* ============ state ============ */
const S = {
  db: null, user: null, dl: null, owner: false,
  mode: "loading", // loading | admin | reader | pin | nodb
  settings: null, settingsExists: false, houses: [], housesExists: false,
  bills: {}, readings: {},
  ready: { s: false, h: false, b: false, r: false }, slow: false, writeDenied: false,
  view: "home", q: "", hfilter: "all", rfilter: "pending", billMonth: null, readMonth: curMonth(), bfilter: "all",
};
const st = () => Object.assign({}, DEF, S.settings || {});
const soldHouses = () => S.houses.filter(h => h.sold).sort(hsort);
function hsort(a, b) { const x = parseFloat(a.no), y = parseFloat(b.no); if (!isNaN(x) && !isNaN(y) && x !== y) return x - y; return String(a.no).localeCompare(String(b.no)); }
const billMonths = () => Object.keys(S.bills).sort();
const latestBillMonth = () => billMonths().slice(-1)[0] || null;

function readingOf(hid, month) { const d = S.readings[month]; const e = d && d.r && d.r[hid]; return e && e.v != null ? num(e.v) : null; }
function prevReading(h, month) {
  const ms = Object.keys(S.readings).filter(m => m < month).sort().reverse();
  for (const m of ms) { const v = readingOf(h.id, m); if (v != null) return v; }
  return num(h.opening);
}
function balance(b) { return r2(num(b.total) - num(b.paid)); }
function status(b) {
  const bal = balance(b);
  if (bal <= 0) return { k: "paid", t: "Paid" };
  if (b.carried) return { k: "carried", t: "Agle bill mein" };
  if (num(b.paid) > 0) return { k: "part", t: "Partial" };
  return { k: "unpaid", t: "Unpaid" };
}
const badge = s => `<span class="badge b-${s.k}">${s.t}</span>`;

/* ============ boot ============ */
async function boot() {
  const C = window.claude;
  if (!C || !C.use) { S.mode = "nodb"; render(); return; }
  const [db, user, dl] = await Promise.all([C.use("db"), C.use("user"), C.use("downloads")].map(p => Promise.resolve(p).catch(() => null)));
  S.db = db; S.user = user; S.dl = dl;
  if (!db) { S.mode = "nodb"; render(); return; }
  try { S.owner = user ? !!(await user.isOwner()) : false; } catch (e) { S.owner = false; }
  S.mode = S.owner ? "admin" : (ss("rg_mode") || "pin");
  const slowT = setTimeout(() => { S.slow = true; render(); }, 10000);
  const done = k => { S.ready[k] = true; if (Object.values(S.ready).every(Boolean)) { clearTimeout(slowT); S.slow = false; } render(); };
  const fail = k => e => { console.warn(k, e); done(k); };
  db.doc("society/settings").onSnapshot(s => { S.settingsExists = s.exists; S.settings = s.exists ? s.data() : null; if (!s.metadata.fromCache) done("s"); else render(); }, fail("s"));
  db.doc("society/houses").onSnapshot(s => { S.housesExists = s.exists; S.houses = s.exists ? (s.data().list || []).slice() : []; if (!s.metadata.fromCache) done("h"); else render(); }, fail("h"));
  db.collection("bills").orderBy("month", "desc").limit(36).onSnapshot(q => { const o = {}; q.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); S.bills = o; if (!q.metadata.fromCache) done("b"); else render(); }, fail("b"));
  db.collection("readings").orderBy("month", "desc").limit(36).onSnapshot(q => { const o = {}; q.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); S.readings = o; if (!q.metadata.fromCache) done("r"); else render(); }, fail("r"));
}
async function write(fn) {
  try { await fn(); return true; }
  catch (e) {
    console.warn(e);
    if (e && e.code === "invalid_argument") { toast("Save nahi hua: aap ko is ki ijazat nahi (admin se access lein)"); S.writeDenied = true; }
    else if (e && e.code === "quota_exceeded") toast("Database bhar gaya hai: purana data saaf karein");
    else toast("Save nahi hua, dobara koshish karein");
    return false;
  }
}

/* ============ render ============ */
function render(force) {
  if (!force && S.dirty && $("#app form[data-f]")) return; // don't wipe a form the admin is typing in
  S.dirty = false;
  const a = document.activeElement, aid = a && a.id, sel = a && a.selectionStart;
  const app = $("#app");
  if (S.mode === "loading") app.innerHTML = `<div class="boot">Load ho raha hai…</div>`;
  else if (S.mode === "nodb") app.innerHTML = `<div class="boot"><b>Data se connect nahi ho saka.</b><br>Yeh page Claude par sign in kar ke kholein. Agar aap reader hain to admin se kahein ke yeh link aap ke saath share kare.</div>`;
  else if (!S.ready.s || !S.ready.h) app.innerHTML = `<div class="boot">Data aa raha hai…${S.slow ? "<br><br>Data abhi nahi mil raha. Internet check karein." : ""}</div>`;
  else if (S.mode === "pin") app.innerHTML = viewPin();
  else if (S.mode === "reader") app.innerHTML = viewReader();
  else app.innerHTML = viewAdmin();
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) { } } }
}
function header(sub, tabs) {
  const s = st();
  return `<div class="top"><h1><span>${esc(s.name)} <small>${esc(sub)}</small></span>${S.mode === "reader" && S.owner ? `<button class="btn sm" data-a="toAdmin">Admin</button>` : ""}${S.mode !== "admin" && !S.owner ? `<button class="btn sm" data-a="logout">Lock</button>` : ""}${S.mode === "admin" && !S.owner ? `<button class="btn sm" data-a="logout">Lock</button>` : ""}</h1>${tabs || '<div style="height:12px"></div>'}</div>`;
}

/* ---- PIN ---- */
function viewPin() {
  if (!S.settingsExists) return header("") + `<div class="boot">Admin ne abhi system set up nahi kiya.</div>`;
  return header("Login") + `<div class="pinbox card"><h2>Meter Reader Login</h2><p class="muted">Apna PIN darj karein.</p>
  <form data-f="pin"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="font-size:22px;text-align:center;letter-spacing:6px"><div style="height:10px"></div><button class="btn pri" style="width:100%;justify-content:center">Login</button></form></div>`;
}

/* ---- ADMIN ---- */
const TABS = [["home", "Home"], ["houses", "Ghar"], ["readings", "Readings"], ["bills", "Bills"], ["pending", "Pending"], ["settings", "Settings"]];
function viewAdmin() {
  const tabs = `<div class="tabs">${TABS.map(([k, t]) => `<button class="tab ${S.view === k ? "on" : ""}" data-a="tab" data-v="${k}">${t}</button>`).join("")}</div>`;
  let body;
  if (!S.settingsExists && S.view !== "settings") body = viewSetup();
  else if (!S.housesExists && S.view !== "settings") body = viewSetup();
  else body = ({ home: vHome, houses: vHouses, readings: vReadings, bills: vBills, pending: vPending, settings: vSettings }[S.view] || vHome)();
  return header("Water & Maintenance Billing", tabs) + `<main>${S.slow ? `<div class="note">Data abhi poora nahi mila; jo dikh raha hai woh purana ho sakta hai.</div>` : ""}${body}</main>`;
}
function viewSetup() {
  return `<div class="card"><h2>Pehli dafa setup</h2><p class="muted">Society ke ghar bana dein. Baad mein har ghar ki details (maalik, phone, marla) "Ghar" tab se badal sakte hain.</p>
  <form data-f="setup"><div class="f2">
  <label class="f"><span>Society ka naam</span><input type="text" name="name" value="${esc(st().name)}"></label>
  <label class="f"><span>Society ka naam (Urdu, bill ke liye)</span><input type="text" name="nameUr" dir="rtl" value="${esc(st().nameUr)}"></label>
  <label class="f"><span>Kul ghar</span><input type="number" name="total" value="200" min="1" max="2000"></label>
  <label class="f"><span>Har ghar ke default marla</span><input type="number" name="marla" value="5" step="0.5" min="0"></label>
  <label class="f"><span>Per marla rate (Rs)</span><input type="number" name="marlaRate" value="${esc(st().marlaRate)}"></label>
  <label class="f"><span>Water rate per unit (Rs)</span><input type="number" name="unitRate" value="${esc(st().unitRate || "")}" step="0.01" placeholder="maslan 15"></label>
  </div>
  <label class="f"><span>Sold gharon ke number (comma ya range: 1-50, 61, 70-99)</span><textarea name="sold" rows="2" placeholder="1-80"></textarea></label>
  <label class="f"><span>Reader PIN</span><input type="text" name="readerPin" value="${esc(st().readerPin)}" inputmode="numeric"></label>
  <button class="btn pri">Setup mukammal karein</button></form></div>`;
}
function vHome() {
  const sold = soldHouses(), cm = curMonth();
  const done = sold.filter(h => readingOf(h.id, cm) != null).length;
  const lm = latestBillMonth(); const lb = lm ? S.bills[lm] : null;
  let billed = 0, coll = 0, pend = 0, pendN = 0;
  if (lb) Object.values(lb.b || {}).forEach(b => { billed += num(b.total); coll += num(b.paid); const bal = balance(b); if (bal > 0) { pend += bal; pendN++; } });
  const s = st();
  return `<div class="grid" style="margin-bottom:14px">
  <div class="stat"><span>Kul ghar</span><b>${S.houses.length}</b></div>
  <div class="stat"><span>Sold ghar</span><b>${sold.length}</b></div>
  <div class="stat"><span>Readings (${mLabel(cm)})</span><b>${done} / ${sold.length}</b></div>
  <div class="stat"><span>Pending (${lm ? mLabel(lm) : "-"})</span><b style="color:var(--red)">${money(pend)}</b><span>${pendN} ghar</span></div>
  </div>
  ${lb ? `<div class="card"><h2>Aakhri bill: ${mLabel(lm)}</h2><div class="kv"><span>Kul bill</span><b>${money(billed)}</b></div><div class="kv"><span>Wusool</span><b style="color:var(--grn)">${money(coll)}</b></div><div class="kv"><span>Baqi</span><b style="color:var(--red)">${money(pend)}</b></div><div class="row" style="margin-top:12px"><button class="btn" data-a="tab" data-v="bills">Bills dekhein</button><button class="btn" data-a="tab" data-v="pending">Pending list</button></div></div>` : `<div class="info">Abhi koi bill nahi bana. Readings ho jayein to "Bills" tab se is mahine ke bill generate karein.</div>`}
  <div class="card"><h2>Rates</h2><div class="kv"><span>Per marla</span><b>${money(s.marlaRate)}</b></div><div class="kv"><span>Water per unit</span><b>${s.unitRate ? "Rs " + s.unitRate : '<span style="color:var(--red)">Set nahi</span>'}</b></div><div class="kv"><span>Reader PIN</span><b>${esc(s.readerPin || "-")}</b></div></div>
  <div class="card"><h2>Meter reader ko kaise bhejein</h2><p class="muted" style="margin:0 0 10px">Is page ko claude.ai par "Share" se reader ke email ke saath share karein (Contributor ya Editor access, taake woh reading save kar sake). Reader link khol kar apna PIN dalega aur sirf reading ka page dekhega.</p><button class="btn" data-a="toReader">Reader mode khud check karein</button></div>`;
}
function vHouses() {
  const q = S.q.trim().toLowerCase();
  let list = S.houses.slice().sort(hsort);
  if (S.hfilter === "sold") list = list.filter(h => h.sold); else if (S.hfilter === "unsold") list = list.filter(h => !h.sold);
  if (q) list = list.filter(h => (h.no + " " + (h.owner || "") + " " + (h.phone || "") + " " + (h.meter || "") + " " + (h.code || "")).toLowerCase().includes(q));
  const ns = S.houses.filter(h => h.sold).length;
  return `<div class="row" style="margin-bottom:12px"><input id="q" type="text" placeholder="Plot no., naam, phone, code se talaash…" value="${esc(S.q)}" style="flex:1;min-width:200px"><button class="btn" data-a="importXl">Excel se import</button><button class="btn pri" data-a="addHouse">+ Naya ghar</button></div>
  <div class="row" style="margin-bottom:12px"><div class="chips">${[["all", "Sab (" + S.houses.length + ")"], ["sold", "Sold (" + ns + ")"], ["unsold", "Unsold (" + (S.houses.length - ns) + ")"]].map(([k, t]) => `<button class="chip ${S.hfilter === k ? "on" : ""}" data-a="hf" data-v="${k}">${t}</button>`).join("")}</div><span class="sp"></span><button class="btn sm" data-a="bulkSold">Kai ghar ek saath Sold karein</button></div>

async function saveHouse(form) {
  const fd = new FormData(form); const id = form.dataset.id;
  const no = String(fd.get("no") || "").trim(); if (!no) return toast("Ghar number likhein");
  const list = S.houses.slice();
  if (list.some(x => String(x.no).toLowerCase() === no.toLowerCase() && x.id !== id)) return toast("Yeh ghar number pehle se mojood hai");
  const rec = { no, street: String(fd.get("street") || "").trim(), code: String(fd.get("code") || "").trim(), phone2: String(fd.get("phone2") || "").trim(), prevBal: num(fd.get("prevBal")), owner: String(fd.get("owner") || "").trim(), phone: String(fd.get("phone") || "").trim(), marla: num(fd.get("marla")), meter: String(fd.get("meter") || "").trim(), opening: num(fd.get("opening")), sold: !!fd.get("sold") };
  if (id) { const i = list.findIndex(x => x.id === id); list[i] = Object.assign({}, list[i], rec); }
  else { let nid = hidFor(no); while (list.some(x => x.id === nid)) nid += "_"; list.push(Object.assign({ id: nid }, rec)); }
  if (await write(() => S.db.doc("society/houses").set({ list }))) { closeModal(); toast("Save ho gaya"); }
}

async function generateBills(m, dueDate) {

    const hadBill = months.some(mm => mm < m && S.bills[mm].b && S.bills[mm].b[h.id]);

  });
  const ok = await write(async () => {
    await S.db.doc("bills/" + m).set({ month: m, generatedAt: (ex && ex.generatedAt) || new Date().toISOString(), dueDate, b });
    if (prev) { const u = {}; Object.keys(b).forEach(id => { if (prev.b[id]) u[id] = { carried: true, carriedTo: m }; }); if (Object.keys(u).length) await S.db.doc("bills/" + prevM).update({ b: u }); }

}

  if (!S.dl) { toast("Is view mein download available nahi. Image par long-press kar ke save karein."); return; }
  try { await S.dl.save({ filename: name, data: blob }); toast("File save ho gayi"); }
  catch (e) { if (e && e.code !== "declined") toast("Download nahi ho saka (" + (e.code || "error") + ")"); }
}
async function pdfFor(m, list, name) {
  if (!list.length) return toast("Koi bill nahi");
  openModal(`<h3>PDF ban rahi hai…</h3><div class="bar"><i id="pbar" style="width:0"></i></div><p class="muted" id="ptxt">0 / ${list.length}</p>`);
  const imgs = [];
  for (let i = 0; i < list.length; i++) { const c = await billCanvas(m, list[i]); imgs.push(await canvasJpeg(c)); const pb = $("#pbar"); if (pb) { pb.style.width = ((i + 1) / list.length * 100) + "%"; $("#ptxt").textContent = (i + 1) + " / " + list.length; } }
  const blob = makePdf(imgs);
  openModal(`<h3>PDF tayyar hai<button class="x" data-a="close">×</button></h3><p>${list.length} bills · ${(blob.size / 1048576).toFixed(1)} MB</p><button class="btn pri" id="pdfsave">Download karein</button>`);
  $("#pdfsave").onclick = () => saveFile(name, blob);
}

function hidFor(no) { return String(no).replace(/\./g, "-").replace(/[^A-Za-z0-9_-]/g, "") || "h"; }
function cleanName(n) { n = String(n ?? "").replace(/\s+/g, " ").trim(); const w = n.split(" "); if (w.length === 2 && w[0].toLowerCase() === w[1].toLowerCase()) n = w[0]; return n; }
function plotStr(v) { if (typeof v === "number") return v.toFixed(2); return String(v ?? "").trim(); }
let xlsxP = null;
function loadXlsx() { if (window.XLSX) return Promise.resolve(window.XLSX); if (!xlsxP) xlsxP = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = () => res(window.XLSX); sc.onerror = () => { xlsxP = null; rej(new Error("load")); }; document.head.appendChild(sc); }); return xlsxP; }
function parseProfile(rows) {
  // find header row with a PLOT column
  let hi = rows.findIndex(r => r.some(c => /plot/i.test(String(c || ""))));
  if (hi < 0) return null;
  const hd = rows[hi].map(c => String(c || "").toLowerCase().replace(/[^a-z0-9]/g, ""));
  const col = (...keys) => hd.findIndex(h => keys.some(k => h === k || h.startsWith(k)));
  const ci = { no: col("plotname", "plotno", "plot"), street: col("street"), area: col("area", "marla"), code: col("subscode", "code"), owner: col("owner", "name"), phone: col("mobile1", "mobile", "phone"), phone2: col("mobile2"), bal: col("previousbalance", "prevbalance", "balance"), meter: col("meter"), opening: col("openingreading", "reading") };
  if (ci.no < 0) return null;
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const no = plotStr(r[ci.no]); if (!no) continue;
    const g = k => ci[k] >= 0 ? r[ci[k]] : "";
    let ph = String(g("phone") ?? "").trim(), ph2 = String(g("phone2") ?? "").trim();
    const parts = ph.split(/\s+(?=\d)/); if (parts.length > 1 && !ph2) { ph = parts[0]; ph2 = parts.slice(1).join(" "); }
    out.push({ no, street: String(g("street") ?? "").trim(), marla: num(g("area")), code: String(g("code") ?? "").trim(), owner: cleanName(g("owner")), phone: ph, phone2: ph2, prevBal: num(g("bal")), meter: String(g("meter") ?? "").trim(), opening: num(g("opening")) });
  }
  return out;
}
async function importExcel(file) {
  openModal(`<h3>Excel parh rahe hain…</h3>`);
  let X; try { X = await loadXlsx(); } catch (e) { openModal(`<h3>Excel reader load nahi hua<button class="x" data-a="close">×</button></h3><p>Internet check kar ke dobara koshish karein.</p>`); return; }
  const wb = X.read(await file.arrayBuffer(), { type: "array" });
  let rows = null, sheet = "";
  for (const n of wb.SheetNames) { const r = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }); const p = parseProfile(r); if (p && p.length) { rows = p; sheet = n; break; } }
  if (!rows) { openModal(`<h3>Data nahi mila<button class="x" data-a="close">×</button></h3><p>Excel mein "PLOT NAME", "AREA", "Owner", "MOBILE 1" wale columns hone chahiye.</p>`); return; }
  const byNo = new Map(S.houses.map(h => [String(h.no), h]));
  const nNew = rows.filter(r => !byNo.has(r.no)).length;
  S.pendingImport = rows;
  openModal(`<h3>Excel import<button class="x" data-a="close">×</button></h3>
  <p>Sheet <b>${esc(sheet)}</b> se <b>${rows.length}</b> plot mile: ${rows.length - nNew} pehle se list mein (update honge), ${nNew} naye.</p>
  <label class="row" style="margin-bottom:8px"><input type="radio" name="imode" value="merge" checked> Merge: Excel wale plot update/add, baqi list waise hi</label>
  <label class="row" style="margin-bottom:14px"><input type="radio" name="imode" value="replace"> Replace: purani list hata kar sirf Excel ke plot rakhen</label>
  <p class="muted" style="font-size:13px">Excel ke sab plot "Sold" mark honge. Bills aur readings pe asar nahi hoga.</p>
  <button class="btn pri" data-a="importGo">Import karein</button>`);
}
async function applyImport(mode) {
  const rows = S.pendingImport || []; if (!rows.length) return;
  let list = mode === "replace" ? [] : S.houses.map(h => Object.assign({}, h));
  rows.forEach(r => {
    const i = list.findIndex(h => String(h.no) === r.no);
    const rec = { no: r.no, street: r.street, marla: r.marla, code: r.code, owner: r.owner, phone: r.phone, phone2: r.phone2, prevBal: r.prevBal, sold: true };
    if (r.meter) rec.meter = r.meter; if (r.opening) rec.opening = r.opening;
    if (i >= 0) list[i] = Object.assign({}, list[i], rec);
    else { const old = S.houses.find(h => String(h.no) === r.no); let id = old ? old.id : hidFor(r.no); while (list.some(h => h.id === id)) id += "_"; list.push(Object.assign({ id, meter: "", opening: 0 }, rec)); }
  });
  if (await write(() => S.db.doc("society/houses").set({ list }))) { closeModal(); S.pendingImport = null; toast(rows.length + " plots import ho gaye"); }
}

/* ============ events ============ */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id, m = t.dataset.m;
  if (t.tagName === "A") return;
  switch (a) {
    case "tab": S.view = t.dataset.v; S.q = ""; closeModal(); render(true); window.scrollTo(0, 0); break;
    case "close": closeModal(); break;
    case "hf": S.hfilter = t.dataset.v; render(true); break;
    case "rf": S.rfilter = t.dataset.v; render(true); break;
    case "bf": S.bfilter = t.dataset.v; render(true); break;
    case "toReader": S.mode = "reader"; S.q = ""; render(true); break;
    case "toAdmin": S.mode = "admin"; render(true); break;
    case "logout": ss("rg_mode", null); S.mode = "pin"; render(true); break;
    case "addHouse": houseModal(null); break;
    case "importXl": { const fi = document.createElement("input"); fi.type = "file"; fi.accept = ".xlsx,.xlsm,.xls,.csv"; fi.onchange = () => { if (fi.files[0]) importExcel(fi.files[0]); }; fi.click(); break; }
    case "importGo": { const md = (document.querySelector("input[name=imode]:checked") || {}).value || "merge"; if (md === "replace" && !(await ask("Purani list hatayen?", "Jo plot Excel mein nahi, woh list se hat jayenge.", "Replace", true))) break; applyImport(md); break; }
    case "editHouse": houseModal(S.houses.find(h => h.id === id)); break;
    case "delHouse": { const h = S.houses.find(x => x.id === id); if (await ask("Ghar delete karein?", "Plot # " + esc(h.no) + " list se hat jayega. Purane bills mehfooz rahenge.", "Delete", true)) { if (await write(() => S.db.doc("society/houses").set({ list: S.houses.filter(x => x.id !== id) }))) toast("Delete ho gaya"); } break; }
    case "bulkSold": openModal(`<h3>Kai ghar Sold karein<button class="x" data-a="close">×</button></h3><form data-f="bulkSold"><label class="f"><span>Ghar number (maslan 1-50, 61, 70-80)</span><textarea name="nos" rows="3"></textarea></label><label class="row" style="margin-bottom:12px"><input type="radio" name="v" value="1" checked> Sold &nbsp; <input type="radio" name="v" value="0"> Unsold</label><button class="btn pri">Apply</button></form>`); break;
    case "reading": readingModal(id); break;
    case "delReading": { if (await ask("Reading hatayen?", "Is ghar ki is mahine ki reading delete ho jayegi.", "Hatayen", true)) { const d = S.readings[S.readMonth]; const r = Object.assign({}, d.r); delete r[id]; if (await write(() => S.db.doc("readings/" + S.readMonth).set({ month: S.readMonth, r }))) toast("Reading hat gayi"); } break; }
    case "otherMonth": openModal(`<h3>Mahina chunein<button class="x" data-a="close">×</button></h3><input type="month" id="om" value="${S.billMonth || curMonth()}"><div style="height:12px"></div><button class="btn pri" data-a="omGo">Kholein</button>`); break;
    case "omGo": { const v = $("#om").value; if (v) { S.billMonth = v; closeModal(); render(true); } break; }
    case "gen": { const due = $("#due").value || addDays(todayISO(), 10); if (!num(st().unitRate) && !(await ask("Water rate set nahi", "Water rate per unit 0 hai, is liye water bill 0 aayega. Phir bhi generate karein?", "Generate"))) break; t.disabled = true; t.textContent = "Ban rahe hain…"; await generateBills(S.billMonth, due); render(true); break; }
    case "regen": { if (await ask("Dobara generate karein?", "Is mahine ke bills nayi readings aur sold gharon ke hisaab se dobara banenge. Payments, fine aur purane rates mehfooz rahenge.", "Generate")) { await generateBills(S.billMonth, S.bills[S.billMonth].dueDate); render(true); } break; }
    case "bill": billModal(m, id); break;
    case "pay": payModal(m, id); break;
    case "fine": fineModal(m, id); break;
    case "unfine": if (await setFine(m, id, 0)) { toast("Fine hat gaya"); billModal(m, id); } break;
    case "delPay": { if (!(await ask("Payment hatayen?", "Yeh payment record delete ho jayega.", "Hatayen", true))) { billModal(m, id); break; } const b = S.bills[m].b[id]; const payments = (b.payments || []).filter((_, i) => i !== +t.dataset.i); const paid = r2(payments.reduce((s, p) => s + num(p.amt), 0)); if (await write(() => S.db.doc("bills/" + m).update({ b: { [id]: { payments, paid } } }))) toast("Payment hat gayi"); billModal(m, id); break; }
    case "bulkFine": { const mm = S.billMonth, bill = S.bills[mm]; const list = Object.values(bill.b).filter(b => balance(b) > 0 && !num(b.fine)); if (!list.length) { toast("Koi unpaid bill baghair fine ke nahi"); break; } openModal(`<h3>Unpaid bills par fine<button class="x" data-a="close">×</button></h3><p>${list.length} unpaid bills (jin par abhi fine nahi) par fine lagega.</p><form data-f="bulkFine"><label class="f"><span>Fine (Rs)</span><input type="number" name="amt" value="${num(st().fineDefault) || ""}" min="1" required></label><button class="btn pri">Apply</button></form>`); break; }
    case "pdf1": case "img1": { const b = S.bills[m].b[id]; t.disabled = true; const c = await billCanvas(m, b); t.disabled = false; const fn = "Bill-" + b.no + "-" + m; if (a === "img1") c.toBlob(bl => saveFile(fn + ".jpg", bl), "image/jpeg", 0.9); else saveFile(fn + ".pdf", makePdf([await canvasJpeg(c)])); break; }
    case "pdfAll": case "pdfPending": { const mm = S.billMonth; let list = Object.values(S.bills[mm].b).sort((x, y) => hsort({ no: x.no }, { no: y.no })); if (a === "pdfPending") list = list.filter(b => balance(b) > 0); pdfFor(mm, list, (a === "pdfAll" ? "Bills-" : "Unpaid-Bills-") + mm + ".pdf"); break; }
    case "qrdel": if (await write(() => S.db.doc("society/settings").set(Object.assign({}, st(), { qr: "" })))) toast("QR hat gaya"); break;
    case "backup": { const data = { exportedAt: new Date().toISOString(), settings: Object.assign({}, S.settings, { qr: S.settings && S.settings.qr ? "(image)" : "" }), houses: S.houses, readings: S.readings, bills: S.bills }; saveFile("royal-garden-backup-" + todayISO() + ".json", JSON.stringify(data, null, 1)); break; }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; render(true); }
  else if (e.target.closest("#app form[data-f]")) S.dirty = true;
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "rm") { if (t.value) { S.readMonth = t.value; render(true); } }
  else if (t.id === "bm") { S.billMonth = t.value; S.q = ""; render(true); }
  else if (t.id === "qrfile" && t.files[0]) {
    const f = t.files[0]; const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    const img = await loadImg(url); if (!img) return toast("Tasveer nahi khul saki");
    const mx = 600, sc = Math.min(1, mx / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    let d = c.toDataURL("image/png"); if (d.length > 180000) d = c.toDataURL("image/jpeg", 0.85);
    if (await write(() => S.db.doc("society/settings").set(Object.assign({}, st(), { qr: d })))) { const im = $("#qrimg"); if (im) im.src = d; toast("QR save ho gaya"); }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, k = f.dataset.f, fd = new FormData(f); S.dirty = false;
  if (k === "pin") {
    const p = String($("#pin").value || "").trim(), s = st();
    if (p && p === String(s.readerPin)) { S.mode = "reader"; ss("rg_mode", "reader"); S.rfilter = "pending"; render(true); }
    else if (p && s.adminPin && p === String(s.adminPin)) { S.mode = "admin"; ss("rg_mode", "admin"); render(true); }
    else toast("PIN ghalat hai");
  } else if (k === "setup") {
    const total = Math.min(2000, Math.max(1, Math.round(num(fd.get("total"))))), marla = num(fd.get("marla"));
    const sold = parseRanges(fd.get("sold"));
    const list = []; for (let i = 1; i <= total; i++) list.push({ id: String(i), no: String(i), owner: "", phone: "", marla, meter: "", opening: 0, sold: sold.has(String(i)) });
    const s = Object.assign({}, st(), { name: String(fd.get("name") || DEF.name), nameUr: String(fd.get("nameUr") || ""), marlaRate: num(fd.get("marlaRate")), unitRate: num(fd.get("unitRate")), readerPin: String(fd.get("readerPin") || "1234") });
    const ok = await write(async () => { await S.db.doc("society/settings").set(s); if (!S.housesExists) await S.db.doc("society/houses").set({ list }); });
    if (ok) { toast("Setup ho gaya"); S.view = "houses"; render(true); }
  } else if (k === "settings") {
    const s = Object.assign({}, st());
    ["name", "nameUr", "address", "phone", "jazzNumber", "jazzTitle", "bankName", "bankTitle", "bankAcc", "iban", "readerPin", "adminPin"].forEach(n => s[n] = String(fd.get(n) || "").trim());
    ["marlaRate", "unitRate", "fineDefault", "dueDays"].forEach(n => s[n] = num(fd.get(n)));
    if (!s.readerPin) return toast("Reader PIN khali nahi ho sakta");
    if (await write(() => S.db.doc("society/settings").set(s))) toast("Settings save ho gayi");
  } else if (k === "house") saveHouse(f);
  else if (k === "reading") saveReading(f, (e.submitter && e.submitter.value) || "next");
  else if (k === "pay") savePay(f);
  else if (k === "fine") { const m = f.dataset.m, id = f.dataset.id; const amt = num(fd.get("amt")); if (amt <= 0) return; if (await setFine(m, id, num(S.bills[m].b[id].fine) + amt)) { toast("Fine lag gaya"); billModal(m, id); } }
  else if (k === "bulkFine") {
    const m = S.billMonth, amt = num(fd.get("amt")); if (amt <= 0) return; const u = {};
    Object.values(S.bills[m].b).forEach(b => { if (balance(b) > 0 && !num(b.fine)) u[b.hid] = { fine: amt, total: r2(num(b.total) + amt) }; });
    if (await write(() => S.db.doc("bills/" + m).update({ b: u }))) { closeModal(); toast(Object.keys(u).length + " bills par fine lag gaya"); }
  } else if (k === "bulkSold") {
    const set = parseRanges(fd.get("nos")), v = fd.get("v") === "1"; if (!set.size) return toast("Number likhein");
    let n = 0; const list = S.houses.map(h => { if (set.has(String(h.no)) || set.has(String(parseInt(h.no)))) { n++; return Object.assign({}, h, { sold: v }); } return h; });
    if (await write(() => S.db.doc("society/houses").set({ list }))) { closeModal(); toast(n + " ghar update ho gaye"); }
  }
});
boot();
