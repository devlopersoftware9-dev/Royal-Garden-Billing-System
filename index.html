<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">

<title>Royal Garden Water Billing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16201c;--mute:#66736e;--line:#e2e7e5;--pri:#0f5c4d;--pri-d:#0b4639;--pri2:#e4f1ed;--red:#b3261e;--red2:#fbe9e7;--amb:#9a5800;--amb2:#fff3dc;--grn:#1b7a3d;--grn2:#e3f4e8;--r:14px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---- layout: mobile first ---- */
.appbar{position:sticky;top:0;z-index:10;background:var(--pri);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.appbar .t{flex:1;min-width:0}
.appbar .t b{display:block;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .t small{opacity:.8;font-size:12px}
.ibtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn.on{background:#fff;color:var(--pri)}
main{padding:16px 16px calc(96px + var(--sab));max-width:1100px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--sab))}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:600;cursor:pointer;border-radius:12px}
.bnav button.on{color:var(--pri)}
.bnav button.on svg{background:var(--pri2);border-radius:99px;padding:3px 14px;width:50px;height:28px}
.side{display:none}
.pagehead{display:none}
@media(min-width:900px){
  body:not(.reader) #app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
  .appbar.mob{display:none}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--pri-d);color:#cfe6df;padding:20px 12px}
  .side .brand{color:#fff;font-weight:700;font-size:18px;padding:4px 12px 2px}
  .side .brand small{display:block;font-weight:400;font-size:12px;color:#9fc7bc;margin-top:2px}
  .side nav{margin-top:22px;display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:550;text-align:left}
  .side nav button:hover{background:rgba(255,255,255,.07)}
  .side nav button.on{background:rgba(255,255,255,.14);color:#fff}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  main{padding:28px 32px 40px;width:100%}
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .pagehead h1{margin:0;font-size:24px;font-weight:700;flex:1}
}
/* ---- components ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:650}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}

.cols{display:grid;gap:14px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stat span{color:var(--mute);font-size:12.5px;display:block}
.stat b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat em{font-style:normal;color:var(--mute);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn:hover{border-color:#b9c6c1}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.red{color:var(--red);border-color:#efc6c2}
.btn.grn{background:#1f8f4c;border-color:#1f8f4c;color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;min-height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:700px){.actions{display:flex;flex-wrap:wrap}}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=month],input[type=password],input[type=search],select,textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid #8cc5b7;border-color:var(--pri)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:5px;font-weight:500}
.f2{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:620px){.f2{grid-template-columns:1fr 1fr}}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.toggle small{display:block;color:var(--mute)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:64px}
.item:last-child{border-bottom:0}
.item:hover{background:#fafcfb}
.hno{min-width:58px;height:42px;border-radius:10px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 6px;font-variant-numeric:tabular-nums}
.item .m{flex:1;min-width:0}
.item .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .m small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.b-paid{background:var(--grn2);color:var(--grn)}
.b-unpaid{background:var(--red2);color:var(--red)}
.b-part{background:var(--amb2);color:var(--amb)}
.b-carried{background:#eceff1;color:#546e7a}
.b-sold{background:var(--pri2);color:var(--pri)}
.b-no{background:#eceff1;color:#78858a}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{flex:1;min-width:200px}
.note{background:var(--amb2);color:#5c3b00;border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.info{background:var(--pri2);color:#0c4a3e;border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.err{background:var(--red2);color:var(--red);border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.muted{color:var(--mute)}
.bar{height:8px;background:#e6ecea;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.empty{padding:34px 20px;text-align:center;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv b{text-align:right}
.modal{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
@media(min-width:700px){.modal{align-items:center}}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--sab))}
@media(min-width:700px){.sheet{border-radius:18px}}
.sheet.wide{max-width:780px}
.bview{display:flex;align-items:center;justify-content:center;min-height:200px;margin:0 0 10px}
.bimg{display:block;max-width:100%;width:auto;height:auto;max-height:var(--bh,calc(92dvh - 220px));border:1px solid var(--line);border-radius:8px;cursor:zoom-in;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.bacts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.bacts .btn{flex:1 1 auto}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.x{margin-left:auto;border:0;background:#f0f3f2;border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:19px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:#16201c;color:#fff;padding:11px 16px;border-radius:11px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.preview{width:100%;border:1px solid var(--line);border-radius:10px;display:block}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 2px 10px;margin-bottom:12px}
.msg{max-width:86%;align-self:flex-start;background:#f1f4f3;border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:14px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--pri2);border-radius:14px 14px 4px 14px}
.msg .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:4px}
.msg p{margin:0;white-space:pre-wrap;word-break:break-word}
.msg img{display:block;max-width:100%;max-height:260px;border-radius:9px;margin-top:7px;cursor:zoom-in;border:1px solid var(--line)}
.msg .actions{margin:8px 0 0}
.fab{position:fixed;right:16px;bottom:calc(18px + var(--sab));z-index:20;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:13px 18px 13px 15px;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(15,92,77,.35);cursor:pointer}
.fab .i{width:22px;height:22px}.fab .dot{position:absolute;top:-5px;right:-3px;background:var(--red);color:#fff;border-radius:99px;font-size:12px;font-weight:700;min-width:20px;height:20px;line-height:20px;padding:0 5px;text-align:center;border:2px solid #fff}
.ibtn{position:relative}.ibtn .dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 4px;text-align:center}
.boot{padding:70px 24px;text-align:center;color:var(--mute)}
.qrprev{width:130px;height:130px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--mute);font-weight:600;font-size:12px}
.login{max-width:380px;margin:0 auto;padding:40px 20px}
.login .logo{width:64px;height:64px;border-radius:18px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.login .logo svg{width:34px;height:34px}
.pinin{font-size:26px;text-align:center;letter-spacing:10px;font-weight:700}
.readin::-webkit-inner-spin-button,.readin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.readin{-moz-appearance:textfield;font-size:32px;text-align:center;font-weight:700;min-height:64px}
.rd-plot{font-size:34px;font-weight:800;text-align:center;color:var(--pri);margin:4px 0 2px}
.rd-sub{text-align:center;color:var(--mute);margin-bottom:12px}
.prevbox{display:flex;justify-content:space-around;text-align:center;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
.prevbox span{display:block;font-size:12px;color:var(--mute)}
.prevbox b{font-size:20px}
.reader main{padding-bottom:calc(30px + var(--sab))}
@media(min-width:900px){.reader .appbar.mob{display:flex}.reader main{max-width:720px}}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  html,body{background:#fff!important;margin:0;padding:0}
  #printArea{display:block}
  .pp{break-after:page;page-break-after:always;overflow:hidden}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pp.one{width:210mm;height:296mm}
  .pp.one img{width:210mm;height:296mm;object-fit:contain;display:block}
  .pp.two{width:297mm;height:209mm;display:flex}
  .pp.two img{width:148.5mm;height:209mm;object-fit:contain;display:block;box-sizing:border-box}
  .pp.two img:first-child{border-right:0.3mm dashed #999}
}
</style>

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

/* Which buttons show on a bill, per login type (Settings → Bill buttons). Missing = shown. */

/* Complaints staff rights (Settings → Complaints staff). Also enforced in firestore.rules. */
const SR = [["inbox", "Open the Inbox", "Without this the staff login sees nothing.", true], ["reply", "Reply to residents", "Send replies in the chat.", true], ["resolve", "Mark complaints resolved", "Close or reopen a complaint.", true], ["payments", "See payment screenshots", "Payment messages and screenshots sent by residents.", false], ["messages", "See general messages", "Messages that are not complaints or payments.", false]];
const sr = k => { const r = st().staffRights || {}; const d = SR.find(x => x[0] === k); return r[k] === undefined ? (d ? d[3] : false) : !!r[k]; };
const isOffice = () => S.mode === "admin" || S.mode === "staff";
const staffTopics = () => !sr("inbox") ? [] : ["complaint"].concat(sr("payments") ? ["payment"] : [], sr("messages") ? ["message"] : []);
const topicOf = m => m.topic || m.kind || "message";
const bOn = (role, k) => { const b = st().btns || {}; return !(b[role] && b[role][k] === false); };

/* ============ state ============ */
const S = {
  me: null, uid: null, owner: false,
  mode: "loading", // loading | noconfig | login | admin | reader | resident | norole
  settings: null, settingsExists: false, houses: [], housesExists: false,
  bills: {}, billRuns: {}, billDocs: {}, readings: {}, proofs: [], users: [], msgs: [], chat: null,
  ready: { s: false, h: false }, slow: false, writeDenied: false,
  view: "home", q: "", hfilter: "all", rfilter: "pending", billMonth: null, readMonth: curMonth(), bfilter: "all", lfilter: "all",
};
const st = () => Object.assign({}, DEF, S.settings || {});
const soldHouses = () => S.houses.filter(h => h.sold).sort(hsort);
function hsort(a, b) { const x = parseFloat(a.no), y = parseFloat(b.no); if (!isNaN(x) && !isNaN(y) && x !== y) return x - y; return String(a.no).localeCompare(String(b.no)); }
const billMonths = () => Object.keys(S.bills).sort();
const latestBillMonth = () => billMonths().slice(-1)[0] || null;
function readingOf(hid, month) { const d = S.readings[month]; const e = d && d.r && d.r[hid]; return e && e.v != null ? num(e.v) : null; }
function prevReading(h, month) {
  const ms = Object.keys(S.readings).filter(m => m < month).sort().reverse();
  for (const m of ms) { const v = readingOf(h.id, m); if (v != null) return v; }
  return num(h.opening);
}
function balance(b) { return r2(num(b.total) - num(b.paid)); }
function status(b) {
  const bal = balance(b);
  if (bal <= 0) return { k: "paid", t: "Paid" };
  if (b.carried) return { k: "carried", t: "Carried forward" };
  if (num(b.paid) > 0) return { k: "part", t: "Partly paid" };
  return { k: "unpaid", t: "Unpaid" };
}
const badge = s => `<span class="badge b-${s.k}">${s.t}</span>`;
const isReaderUI = () => S.mode === "reader";
const showPrev = () => !isReaderUI() || st().readerShowPrev !== false;
const showOwner = () => !isReaderUI() || st().readerShowOwner !== false;
const userOfHouse = hid => S.users.find(u => u.role === "resident" && u.hid === hid);

/* ============ Firebase ============ */
let app = null, auth = null, fs = null, auth2 = null;
let unsubs = [];
const unsubAll = () => { unsubs.forEach(f => { try { f(); } catch (e) { } }); unsubs = []; };
const emailFor = (u, v) => u + "." + v + "@" + (FIREBASE_CONFIG.authDomain || "royalgarden.app");
function rebuildBills() {
  const o = {};
  Object.values(S.billDocs).forEach(b => { if (!o[b.month]) o[b.month] = Object.assign({ month: b.month, b: {} }, S.billRuns[b.month] || {}, { b: {} }); o[b.month].b[b.hid] = b; });
  S.bills = o;
}
function listen(ref, onData, key) {
  const f = onSnapshot(ref, snap => { onData(snap); if (key) done(key); else render(); }, err => { console.warn(key, err); if (key) done(key); });
  unsubs.push(f);
}
let slowT = null;
function done(k) { S.ready[k] = true; if (Object.values(S.ready).every(Boolean)) { clearTimeout(slowT); S.slow = false; } render(); }
function startSlowTimer() { clearTimeout(slowT); slowT = setTimeout(() => { S.slow = true; render(); }, 10000); }
const docsToMap = (snap) => { const o = {}; snap.forEach(d => { o[d.id] = d.data(); }); return o; };

function subscribeCommon() {
  listen(doc(fs, "settings", "main"), s => { S.settingsExists = s.exists(); S.settings = s.exists() ? s.data() : null; }, "s");
}
function subscribeAdmin() {
  S.ready = { s: false, h: false }; startSlowTimer(); subscribeCommon();
  listen(collection(fs, "houses"), q => { S.housesExists = !q.empty; S.houses = q.docs.map(d => Object.assign({ id: d.id }, d.data())); }, "h");
  listen(query(collection(fs, "readings"), orderBy("month", "desc"), limit(24)), q => { S.readings = docsToMap(q); });
  listen(query(collection(fs, "billRuns"), orderBy("month", "desc"), limit(24)), q => { S.billRuns = docsToMap(q); rebuildBills(); });
  listen(query(collection(fs, "bills"), where("month", ">=", monthsBack(curMonth(), 14))), q => { S.billDocs = docsToMap(q); rebuildBills(); });
  listen(query(collection(fs, "proofs"), where("status", "==", "pending")), q => { S.proofs = q.docs.map(d => Object.assign({ id: d.id }, d.data())); });
  listen(collection(fs, "users"), q => { S.users = q.docs.map(d => Object.assign({ uid: d.id }, d.data())); });
  listen(query(collection(fs, "messages"), orderBy("at", "desc"), limit(800)), q => { S.msgs = q.docs.map(d => Object.assign({ id: d.id }, d.data())); refreshChat(); });
}
function subscribeReader() {
  S.ready = { s: false, h: false }; startSlowTimer(); subscribeCommon();
  listen(collection(fs, "houses"), q => { S.housesExists = !q.empty; S.houses = q.docs.map(d => Object.assign({ id: d.id }, d.data())); }, "h");
  listen(query(collection(fs, "readings"), orderBy("month", "desc"), limit(6)), q => { S.readings = docsToMap(q); });
}
function subscribeResident() {
  const hid = S.me.hid; S.ready = { s: false, h: false }; startSlowTimer(); subscribeCommon();
  listen(doc(fs, "houses", hid), d => { S.housesExists = d.exists(); S.houses = d.exists() ? [Object.assign({ id: d.id }, d.data())] : []; }, "h");
  listen(collection(fs, "billRuns"), q => { S.billRuns = docsToMap(q); rebuildBills(); });
  listen(query(collection(fs, "bills"), where("hid", "==", hid)), q => { S.billDocs = docsToMap(q); rebuildBills(); });
  listen(query(collection(fs, "proofs"), where("hid", "==", hid)), q => { S.proofs = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))); });
  listen(query(collection(fs, "messages"), where("hid", "==", hid)), q => { S.msgs = q.docs.map(d => Object.assign({ id: d.id }, d.data())); refreshChat(); });
}
let staffMsgUnsubs = [], staffKey = null;
function syncStaffMsgs() {
  const t = staffTopics(), key = t.join(",");
  if (key === staffKey) return; staffKey = key;
  staffMsgUnsubs.forEach(f => { try { f(); } catch (e) { } }); staffMsgUnsubs = []; const parts = {}; S.msgs = [];
  t.forEach(tp => { const f = onSnapshot(query(collection(fs, "messages"), where("topic", "==", tp)), q => { parts[tp] = q.docs.map(d => Object.assign({ id: d.id }, d.data())); S.msgs = [].concat(...Object.values(parts)); refreshChat(); render(); }, err => console.warn("msgs", tp, err)); staffMsgUnsubs.push(f); unsubs.push(f); });
  render();
}
function subscribeStaff() {
  S.ready = { s: false, h: false }; startSlowTimer(); staffKey = null;
  listen(doc(fs, "settings", "main"), s => { S.settingsExists = s.exists(); S.settings = s.exists() ? s.data() : null; syncStaffMsgs(); }, "s");
  listen(collection(fs, "houses"), q => { S.housesExists = !q.empty; S.houses = q.docs.map(d => Object.assign({ id: d.id }, d.data())); }, "h");
}
async function handleUser(u) {
  unsubAll(); S.bills = {}; S.billDocs = {}; S.billRuns = {}; S.readings = {}; S.proofs = []; S.users = []; S.msgs = []; S.chat = null; S.houses = []; S.settings = null;
  if (!u) {
    S.me = null; S.uid = null; S.owner = false;
    try { const d = await getDoc(doc(fs, "meta", "setup")); S.needsBootstrap = !d.exists(); } catch (e) { S.needsBootstrap = false; }
    S.mode = "login"; render(true); return;
  }
  S.uid = u.uid;
  let me = null; try { const d = await getDoc(doc(fs, "users", u.uid)); me = d.exists() ? d.data() : null; } catch (e) { console.warn(e); }
  if (!me) { S.mode = "norole"; render(true); return; }
  S.me = me; S.owner = me.role === "admin"; S.view = "home"; S.q = "";
  if (me.role === "admin") { S.mode = "admin"; subscribeAdmin(); }
  else if (me.role === "reader") { S.mode = "reader"; subscribeReader(); }
  else if (me.role === "resident" && me.hid) { S.mode = "resident"; subscribeResident(); }
  else if (me.role === "staff") { S.mode = "staff"; subscribeStaff(); }
  else S.mode = "norole";
  render(true);
}
async function boot() {
  if (!FIREBASE_CONFIG) { S.mode = "noconfig"; render(true); return; }
  try {
    app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app); fs = initializeFirestore(app, { ignoreUndefinedProperties: true });
    auth2 = getAuth(initializeApp(FIREBASE_CONFIG, "secondary"));
  } catch (e) { console.error(e); S.mode = "noconfig"; render(true); return; }
  onAuthStateChanged(auth, u => { if (S.bootstrapping) return; handleUser(u); });
}
async function login(username, password) {
  const u = cleanUser(username);
  let email = null;
  try { const d = await getDoc(doc(fs, "logins", u)); if (d.exists()) email = d.data().email; } catch (e) { console.warn(e); }
  if (!email) throw new Error("Username not found");
  try { await signInWithEmailAndPassword(auth, email, password); }
  catch (e) { throw new Error(/too-many/.test(e.code || "") ? "Too many attempts. Please wait a few minutes." : "Incorrect password"); }
}
async function bootstrapAdmin(username, password, name) {
  const u = cleanUser(username); if (!validUser(u)) throw new Error("Username can use letters, numbers, dot, dash and underscore");
  if (password.length < 6) throw new Error("Password must be at least 6 characters");
  S.bootstrapping = true;
  try {
    const email = emailFor(u, Date.now().toString(36));
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const b = writeBatch(fs);
    b.set(doc(fs, "users", cred.user.uid), { role: "admin", username: u, name: name || "", hid: null, createdAt: new Date().toISOString() });
    b.set(doc(fs, "meta", "setup"), { at: new Date().toISOString(), by: cred.user.uid });
    b.set(doc(fs, "logins", u), { email, uid: cred.user.uid });
    await b.commit();
    S.bootstrapping = false; await handleUser(cred.user);
  } catch (e) { S.bootstrapping = false; throw e; }
}

/* ============ data layer ============ */
const D = {
  async batched(ops) { for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(fs); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); } },
  async saveHouses(list) {
    const old = new Map(S.houses.map(h => [h.id, h])); const ops = [];
    list.forEach(h => { const o = old.get(h.id); const { id, ...data } = h; if (!o || JSON.stringify(Object.assign({ id: o.id }, o)) !== JSON.stringify(Object.assign({ id }, h))) ops.push(b => b.set(doc(fs, "houses", id), data)); old.delete(h.id); });
    old.forEach((h, id) => ops.push(b => b.delete(doc(fs, "houses", id))));
    await D.batched(ops);
  },
  saveSettings: s => setDoc(doc(fs, "settings", "main"), s),
  saveReading: (m, hid, entry) => setDoc(doc(fs, "readings", m), { month: m, r: { [hid]: entry } }, { merge: true }),
  deleteReading: (m, hid) => updateDoc(doc(fs, "readings", m), new FieldPath("r", hid), deleteField()),
  async saveBillRun(m, meta, bills, prevM, prevIds) {
    const ops = [b => b.set(doc(fs, "billRuns", m), meta)];
    Object.values(bills).forEach(x => ops.push(b => b.set(doc(fs, "bills", m + "_" + x.hid), Object.assign({ month: m }, x))));
    (prevIds || []).forEach(hid => ops.push(b => b.update(doc(fs, "bills", prevM + "_" + hid), { carried: true, carriedTo: m })));
    await D.batched(ops);
  },
  updateBill: (m, hid, fields) => updateDoc(doc(fs, "bills", m + "_" + hid), fields),
  async updateBills(m, map) { await D.batched(Object.entries(map).map(([hid, f]) => b => b.update(doc(fs, "bills", m + "_" + hid), f))); },
  createProof: p => setDoc(doc(collection(fs, "proofs")), p),
  newProofId: () => doc(collection(fs, "proofs")).id,
  createProofWithId: (id, p) => setDoc(doc(fs, "proofs", id), p),
  sendMsg: m => setDoc(doc(collection(fs, "messages")), m),
  updateMsg: (id, f) => updateDoc(doc(fs, "messages", id), f),
  async markSeen(ids, field) { if (!ids.length) return; const b = writeBatch(fs); ids.slice(0, 450).forEach(id => b.update(doc(fs, "messages", id), { [field]: true })); await b.commit(); },
  async reviewProof(p, approve, note) {
    const b = writeBatch(fs);
    if (approve) {
      const bill = S.billDocs[p.month + "_" + p.hid];
      let m = p.month, target = bill;
      if (!target || target.carried) { const lm = billMonths().reverse().find(mm => S.bills[mm].b[p.hid] && !S.bills[mm].b[p.hid].carried); if (lm) { m = lm; target = S.bills[lm].b[p.hid]; } }
      if (!target) throw new Error("No bill found for this plot");
      const payments = (target.payments || []).concat([{ amt: num(p.amount), date: p.date || todayISO(), method: p.method || "JazzCash", note: (p.tid ? "TID " + p.tid : "") + (note ? " " + note : ""), proof: p.id, at: new Date().toISOString() }]);
      b.update(doc(fs, "bills", m + "_" + p.hid), { payments, paid: r2(payments.reduce((s, x) => s + num(x.amt), 0)) });
    }
    b.update(doc(fs, "proofs", p.id), { status: approve ? "approved" : "rejected", reviewNote: note || "", reviewedAt: new Date().toISOString() });
    await b.commit();
  },
  async createLogin(role, username, password, hid, name) {
    const u = cleanUser(username);
    if (!validUser(u)) throw new Error("Username can use letters, numbers, dot, dash and underscore");
    if (String(password).length < 6) throw new Error("Password must be at least 6 characters");
    const ex = await getDoc(doc(fs, "logins", u)); if (ex.exists()) throw new Error("Username \"" + u + "\" is already taken");
    const email = emailFor(u, Date.now().toString(36));
    const cred = await createUserWithEmailAndPassword(auth2, email, password); const uid = cred.user.uid; await signOut(auth2).catch(() => { });
    const b = writeBatch(fs);
    b.set(doc(fs, "users", uid), { role, username: u, hid: hid || null, name: name || "", createdAt: new Date().toISOString() });
    b.set(doc(fs, "logins", u), { email, uid });
    await b.commit();
    return { username: u, password };
  },
  async resetLogin(user, password) {
    const email = emailFor(user.username, Date.now().toString(36));
    const cred = await createUserWithEmailAndPassword(auth2, email, password); const uid = cred.user.uid; await signOut(auth2).catch(() => { });
    const { uid: oldUid, ...data } = user;
    const b = writeBatch(fs);
    b.set(doc(fs, "users", uid), Object.assign({}, data, { resetAt: new Date().toISOString() }));
    b.set(doc(fs, "logins", user.username), { email, uid });
    b.delete(doc(fs, "users", oldUid));
    await b.commit();
    return { username: user.username, password };
  },
  async removeLogin(user) { const b = writeBatch(fs); b.delete(doc(fs, "users", user.uid)); b.delete(doc(fs, "logins", user.username)); await b.commit(); },
  async changeOwnPassword(oldPw, newPw) {
    const u = auth.currentUser; await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, oldPw)); await updatePassword(u, newPw);
  },
  async importBackup(data) {
    const ops = [];
    if (data.settings) { const s = Object.assign({}, data.settings); if (!String(s.qr || "").startsWith("data:")) delete s.qr; delete s.readerPin; delete s.adminPin; delete s.nameUr; ops.push(b => b.set(doc(fs, "settings", "main"), Object.assign({}, st(), s))); }
    (data.houses || []).forEach(h => { const { id, ...d } = h; ops.push(b => b.set(doc(fs, "houses", id), d)); });
    Object.entries(data.readings || {}).forEach(([m, d]) => ops.push(b => b.set(doc(fs, "readings", m), { month: m, r: d.r || {} })));
    Object.entries(data.bills || {}).forEach(([m, run]) => {
      ops.push(b => b.set(doc(fs, "billRuns", m), { month: m, dueDate: run.dueDate || "", generatedAt: run.generatedAt || "" }));
      Object.values(run.b || {}).forEach(x => ops.push(b => b.set(doc(fs, "bills", m + "_" + x.hid), Object.assign({ month: m }, x))));
    });
    await D.batched(ops); return ops.length;
  },
};
async function write(fn) {
  try { await fn(); return true; }
  catch (e) {
    console.warn(e);
    if (e && /permission/i.test(e.code || e.message || "")) { toast("Not saved: you don't have permission for this."); S.writeDenied = true; }
    else toast((e && e.message && !/firebase|firestore/i.test(e.message)) ? e.message : "Could not save. Check your internet and try again.");
    return false;
  }
}

/* ============ render ============ */
function render(force) {
  if (!force && S.dirty && $("#app form[data-f]")) return; // don't wipe a form the admin is typing in
  S.dirty = false;
  const a = document.activeElement, aid = a && a.id, sel = a && a.selectionStart;
  const app = $("#app");
  document.body.classList.toggle("reader", S.mode !== "admin");
  if (S.mode === "loading") app.innerHTML = `<div class="boot">Loading…</div>`;
  else if (S.mode === "noconfig") app.innerHTML = `<div class="boot"><b>Firebase is not connected yet.</b><br>Paste your Firebase config into index.html (see README).</div>`;
  else if (S.mode === "login") app.innerHTML = viewLogin();
  else if (S.mode === "norole") app.innerHTML = `<div class="login"><div class="card"><h2>No access</h2><p class="muted">This account has no access. Please contact the society admin.</p><button class="btn block" data-a="logout">Log out</button></div></div>`;
  else if (!S.ready.s || !S.ready.h) app.innerHTML = `<div class="boot">Loading data…${S.slow ? "<br><br>The data is taking too long. Please check your internet connection." : ""}</div>`;
  else if (S.mode === "reader") app.innerHTML = viewReader();
  else if (S.mode === "resident") app.innerHTML = viewResident();
  else if (S.mode === "staff") app.innerHTML = viewStaff();
  else app.innerHTML = viewAdmin();
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) { } } }
}

  <header class="appbar mob"><div class="t"><b>${esc(TITLES[S.view] || s.name)}</b><small>${esc(s.name)}</small></div><button class="ibtn ${S.view === "inbox" ? "on" : ""}" data-a="tab" data-v="inbox" aria-label="Inbox">${icon("chat")}${ic ? `<span class="dot">${ic}</span>` : ""}</button><button class="ibtn ${S.view === "logins" ? "on" : ""}" data-a="tab" data-v="logins" aria-label="Logins">${icon("users")}</button><button class="ibtn ${S.view === "settings" ? "on" : ""}" data-a="tab" data-v="settings" aria-label="Settings">${icon("settings")}</button></header>
  <main><div class="pagehead"><h1>${esc(TITLES[S.view] || "")}</h1></div>${S.slow ? `<div class="note">Some data has not loaded yet; what you see may be out of date.</div>` : ""}${body}</main>
  <nav class="bnav">${NAV.map(([k, t, ic]) => `<button class="${S.view === k ? "on" : ""}" data-a="tab" data-v="${k}">${icon(ic)}<span>${t === "Dashboard" ? "Home" : t}${k === "pending" && pc ? " (" + pc + ")" : ""}</span></button>`).join("")}</nav>`;
}
function viewSetup() {

  <div class="actions"><button class="btn pri" data-a="importXl">Import Excel file</button><button class="btn" data-a="importBackup">Import backup (.json)</button></div></div>
  <div class="card"><h2>Or create a numbered list</h2>
  <form data-f="setup"><div class="f2">
  <label class="f"><span>Society name</span><input type="text" name="name" value="${esc(st().name)}"></label>
  <label class="f"><span>Total houses</span><input type="number" name="total" value="200" min="1" max="2000"></label>
  <label class="f"><span>Default marla per house</span><input type="number" name="marla" value="5" step="0.5" min="0"></label>
  <label class="f"><span>Rate per marla (Rs)</span><input type="number" name="marlaRate" value="${esc(st().marlaRate)}"></label>
  <label class="f"><span>Water rate per unit (Rs)</span><input type="number" name="unitRate" value="${esc(st().unitRate || "")}" step="0.01" placeholder="e.g. 25"></label>

/* ---- Dashboard ---- */
function vHome() {
  const sold = soldHouses(), cm = curMonth();
  const done = sold.filter(h => readingOf(h.id, cm) != null).length;
  const lm = latestBillMonth(); const lb = lm ? S.bills[lm] : null;
  let billed = 0, coll = 0, pend = 0, pendN = 0, paidN = 0;
  if (lb) Object.values(lb.b || {}).forEach(b => { billed += num(b.total); coll += num(b.paid); const bal = balance(b); if (bal > 0) { pend += bal; pendN++; } else paidN++; });
  const s = st(), pct = billed ? Math.round(coll / billed * 100) : 0;
  const allPend = pendingList().reduce((t, x) => t + x.bal, 0);
  const marla = sold.reduce((t, h) => t + num(h.marla), 0);
  return `<div class="grid">
  <div class="stat"><span>Sold plots</span><b>${sold.length}</b><em>of ${S.houses.length} in list</em></div>
  <div class="stat"><span>Readings · ${mLabel(cm)}</span><b>${done}/${sold.length}</b><em>${sold.length - done} remaining</em></div>
  <div class="stat"><span>Collected${lm ? " · " + mLabel(lm) : ""}</span><b style="color:var(--grn)">${money(coll)}</b><em>${pct}% of ${money(billed)}</em></div>
  <div class="stat"><span>Total outstanding</span><b style="color:var(--red)">${money(allPend)}</b><em>${pendN} unpaid bills</em></div>
  </div>${S.proofs.length ? `<div class="note row"><span class="sp">${S.proofs.length} payment(s) submitted by residents are waiting for your approval.</span><button class="btn sm" data-a="tab" data-v="pending">Review</button></div>` : ""}
  <div class="actions"><button class="btn pri" data-a="tab" data-v="bills">${icon("bills")} Bills</button><button class="btn" data-a="tab" data-v="readings">${icon("readings")} Readings</button><button class="btn" data-a="tab" data-v="pending">${icon("pending")} Pending</button><button class="btn" data-a="toReader">Reader view</button></div>
  <div class="cols">
  ${lb ? `<div class="card"><h2>Latest bill run · ${mLabel(lm)}</h2><div class="bar" style="margin-bottom:12px"><i style="width:${pct}%"></i></div><div class="kv"><span>Total billed</span><b>${money(billed)}</b></div><div class="kv"><span>Collected</span><b style="color:var(--grn)">${money(coll)}</b></div><div class="kv"><span>Outstanding</span><b style="color:var(--red)">${money(pend)}</b></div><div class="kv"><span>Paid / unpaid bills</span><b>${paidN} / ${pendN}</b></div><div class="kv"><span>Due date</span><b>${fmtDate(lb.dueDate)}</b></div></div>`
    : `<div class="card"><h2>No bills yet</h2><p class="muted" style="margin:0 0 12px">Once this month's readings are in, generate the bills from the Bills tab.</p><button class="btn pri" data-a="tab" data-v="bills">Go to Bills</button></div>`}
  <div class="card"><h2>Meter readings · ${mLabel(cm)}</h2><div class="bar" style="margin-bottom:12px"><i style="width:${sold.length ? done / sold.length * 100 : 0}%"></i></div><div class="kv"><span>Completed</span><b>${done}</b></div><div class="kv"><span>Remaining</span><b>${sold.length - done}</b></div><div class="kv"><span>Reader sees previous reading</span><b>${s.readerShowPrev !== false ? "Yes" : "No"}</b></div></div>
  <div class="card"><h2>Rates</h2><div class="kv"><span>Per marla</span><b>${money(s.marlaRate)}</b></div><div class="kv"><span>Water per unit</span><b>${s.unitRate ? "Rs " + s.unitRate : '<span style="color:var(--red)">Not set</span>'}</b></div><div class="kv"><span>Total marla (sold)</span><b>${r2(marla)}</b></div><div class="kv"><span>Monthly marla charges</span><b>${money(marla * num(s.marlaRate))}</b></div></div>
  <div class="card"><h2>Logins</h2><div class="kv"><span>Residents with a login</span><b>${S.users.filter(u => u.role === "resident").length} / ${sold.length}</b></div><div class="kv"><span>Meter readers</span><b>${S.users.filter(u => u.role === "reader").length}</b></div><div class="row" style="margin-top:12px"><button class="btn" data-a="tab" data-v="logins">Manage logins</button><button class="btn" data-a="toReader">Preview reader view</button></div></div>
  </div>`;
}

/* ---- Plots ---- */
function vHouses() {
  const q = S.q.trim().toLowerCase();
  let list = S.houses.slice().sort(hsort);
  if (S.hfilter === "sold") list = list.filter(h => h.sold); else if (S.hfilter === "unsold") list = list.filter(h => !h.sold); else if (S.hfilter === "nophone") list = list.filter(h => !h.phone);
  if (q) list = list.filter(h => (h.no + " " + (h.owner || "") + " " + (h.phone || "") + " " + (h.meter || "") + " " + (h.code || "")).toLowerCase().includes(q));
  const ns = S.houses.filter(h => h.sold).length, np = S.houses.filter(h => !h.phone).length;
  return `<div class="toolbar"><input id="q" type="search" placeholder="Search plot no., name, phone or code…" value="${esc(S.q)}"><button class="btn" data-a="importXl">Import Excel</button><button class="btn pri" data-a="addHouse">+ Add plot</button></div>
  <div class="row" style="margin-bottom:12px"><div class="chips">${[["all", "All (" + S.houses.length + ")"], ["sold", "Sold (" + ns + ")"], ["unsold", "Unsold (" + (S.houses.length - ns) + ")"], ["nophone", "No phone (" + np + ")"]].map(([k, t]) => `<button class="chip ${S.hfilter === k ? "on" : ""}" data-a="hf" data-v="${k}">${t}</button>`).join("")}</div><span class="sp"></span><button class="btn sm" data-a="bulkSold">Mark several as sold</button></div>
  <div class="list">${list.map(h => `<div class="item" data-a="editHouse" data-id="${esc(h.id)}"><div class="hno">${esc(h.no)}</div><div class="m"><b>${esc(h.owner || "—")}</b><small>${h.street ? "Street " + esc(h.street) + " · " : ""}${esc(h.marla)} marla · ${h.phone ? esc(h.phone) : '<span style="color:var(--red)">no phone</span>'}${num(h.prevBal) ? " · Prev. balance " + money(h.prevBal) : ""}</small></div>${h.sold ? '<span class="badge b-sold">Sold</span>' : '<span class="badge b-no">Unsold</span>'}</div>`).join("") || `<div class="empty">No plots found</div>`}</div>`;
}

/* ---- Readings (admin) ---- */
function readingRows(m) {
  const sold = soldHouses(), q = S.q.trim().toLowerCase();
  let list = sold.map(h => ({ h, prev: prevReading(h, m), cur: readingOf(h.id, m), e: S.readings[m] && S.readings[m].r && S.readings[m].r[h.id] }));
  const doneN = list.filter(x => x.cur != null).length;
  if (S.rfilter === "pending") list = list.filter(x => x.cur == null); else if (S.rfilter === "done") list = list.filter(x => x.cur != null);
  if (q) list = list.filter(x => (x.h.no + " " + (showOwner() ? x.h.owner || "" : "") + " " + (x.h.meter || "") + " " + (x.h.street ? "street " + x.h.street : "")).toLowerCase().includes(q));
  return { sold, list, doneN };
}
function progressCard(m, doneN, total) {
  return `<div class="card"><div class="row" style="align-items:flex-end"><label style="flex:1;min-width:150px"><span class="muted" style="font-size:13px;display:block;margin-bottom:5px">Month</span><input type="month" id="rm" value="${m}"></label><div style="flex:2;min-width:200px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>${doneN} of ${total} done</b><span class="muted">${total - doneN} remaining</span></div><div class="bar"><i style="width:${total ? doneN / total * 100 : 0}%"></i></div></div></div></div>`;
}
const rChips = () => `<div class="chips">${[["pending", "Remaining"], ["done", "Done"], ["all", "All"]].map(([k, t]) => `<button class="chip ${S.rfilter === k ? "on" : ""}" data-a="rf" data-v="${k}">${t}</button>`).join("")}</div>`;
function vReadings() {
  const m = S.readMonth, { sold, list, doneN } = readingRows(m);
  const bill = S.bills[m];
  const changed = bill ? sold.filter(h => bill.b && bill.b[h.id] && (bill.b[h.id].curr ?? null) !== readingOf(h.id, m)).length : 0;
  return progressCard(m, doneN, sold.length) +
  (changed ? `<div class="note">Bills for ${mLabel(m)} were already generated, but ${changed} reading(s) were added or changed afterwards. Use "Regenerate" on the Bills tab.</div>` : "") +
  `<div class="toolbar"><input id="q" type="search" placeholder="Search plot no. or name…" value="${esc(S.q)}">${rChips()}</div>
  <div class="list">${list.map(x => `<div class="item" data-a="reading" data-id="${esc(x.h.id)}"><div class="hno">${esc(x.h.no)}</div><div class="m"><b>${esc(x.h.owner || "—")}</b><small>Previous: ${x.prev}${x.cur != null ? ` → Current: ${x.cur} · <b>${r2(x.cur - x.prev)} units</b>` : ""}${x.e && x.e.at ? " · " + fmtDate(x.e.at.slice(0, 10)) + (x.e.by === "reader" ? " (reader)" : "") : ""}</small></div>${x.cur != null ? (x.cur < x.prev ? '<span class="badge b-unpaid">Lower!</span>' : '<span class="badge b-paid">Done</span>') : '<span class="badge b-no">Remaining</span>'}</div>`).join("") || `<div class="empty">${sold.length ? "No plots match this filter" : "Mark plots as sold on the Plots tab first"}</div>`}</div>`;
}

/* ---- Bills ---- */
function vBills() {
  const months = billMonths(), cm = curMonth();
  const opts = Array.from(new Set([...months, cm])).sort().reverse();
  if (!S.billMonth) S.billMonth = months.includes(cm) ? cm : (months.slice(-1)[0] || cm);
  const m = S.billMonth, bill = S.bills[m];
  const sel = `<div class="toolbar"><select id="bm" style="max-width:220px">${opts.map(o => `<option value="${o}" ${o === m ? "selected" : ""}>${mLabel(o)}${S.bills[o] ? "" : " (new)"}</option>`).join("")}</select><button class="btn sm" data-a="otherMonth">Other month</button></div>`;
  if (!bill) {
    const lm = latestBillMonth();
    if (lm && lm > m) return sel + `<div class="note">Bills for a later month (${mLabel(lm)}) already exist. New bills can't be created for an earlier month, as that would break the carried-forward balances.</div>`;
    const sold = soldHouses(), miss = sold.filter(h => readingOf(h.id, m) == null).length, s = st();
    return sel + `<div class="card"><h2>Generate bills for ${mLabel(m)}</h2>
    <div class="kv"><span>Sold plots (bills to create)</span><b>${sold.length}</b></div>
    <div class="kv"><span>Readings completed</span><b>${sold.length - miss} / ${sold.length}</b></div>
    <div class="kv"><span>Rate per marla</span><b>${money(s.marlaRate)}</b></div>
    <div class="kv"><span>Water rate per unit</span><b>${s.unitRate ? "Rs " + s.unitRate : '<span style="color:var(--red)">Not set (Settings)</span>'}</b></div>
    <div class="kv"><span>Previous balance</span><b>${lm ? "Carried from " + mLabel(lm) : "From each plot's opening balance"}</b></div>
    ${miss ? `<div class="note" style="margin-top:12px">${miss} plot(s) have no reading yet. Their water charge will be 0 this month and the units will be billed next month. You may want to finish the readings first.</div>` : ""}
    <label class="f" style="margin-top:12px"><span>Due date</span><input type="date" id="due" value="${addDays(todayISO(), num(s.dueDays) || 10)}"></label>
    <button class="btn pri block" data-a="gen" ${sold.length ? "" : "disabled"}>Generate ${sold.length} bills</button></div>`;
  }
  const rows = Object.values(bill.b || {}).sort((a, b) => hsort({ no: a.no }, { no: b.no }));
  let billed = 0, coll = 0, pend = 0; rows.forEach(b => { billed += num(b.total); coll += num(b.paid); pend += Math.max(0, balance(b)); });
  const isLatest = m === latestBillMonth(), f = S.bfilter, q = S.q.trim().toLowerCase();
  let list = rows;
  if (f === "unpaid") list = list.filter(b => balance(b) > 0); else if (f === "paid") list = list.filter(b => balance(b) <= 0);
  if (q) list = list.filter(b => (b.no + " " + (b.owner || "")).toLowerCase().includes(q));
  const changed = rows.filter(b => (b.curr ?? null) !== readingOf(b.hid, m)).length;
  const newSold = soldHouses().filter(h => !bill.b[h.id]).length;
  return sel + `<div class="grid"><div class="stat"><span>Total billed (${rows.length})</span><b>${money(billed)}</b></div><div class="stat"><span>Collected</span><b style="color:var(--grn)">${money(coll)}</b></div><div class="stat"><span>Outstanding</span><b style="color:var(--red)">${money(pend)}</b></div><div class="stat"><span>Due date</span><b>${fmtDate(bill.dueDate)}</b></div></div>
  ${isLatest && (changed || newSold) ? `<div class="note">${changed ? changed + " reading(s) changed after these bills were generated. " : ""}${newSold ? newSold + " newly sold plot(s) are not in this bill run. " : ""}Tap "Regenerate" — payments and fines are kept.</div>` : ""}
  ${!isLatest ? `<div class="info">This is an older bill run. Its balances have been carried into the next month's bills; record payments there.</div>` : ""}
  <div class="actions"><button class="btn grn" data-a="waPick">Send on WhatsApp…</button><button class="btn pri" data-a="printAll">Print all (2 per A4)</button><button class="btn" data-a="printPending">Print unpaid (2 per A4)</button><button class="btn" data-a="pdfAll">All bills (PDF)</button><button class="btn" data-a="pdfPending">Unpaid bills (PDF)</button>${isLatest ? `<button class="btn" data-a="bulkFine">Fine all unpaid</button><button class="btn" data-a="regen">Regenerate</button>` : ""}</div>
  <div class="toolbar"><input id="q" type="search" placeholder="Search plot no. or name…" value="${esc(S.q)}"><div class="chips">${[["all", "All"], ["unpaid", "Unpaid"], ["paid", "Paid"]].map(([k, t]) => `<button class="chip ${f === k ? "on" : ""}" data-a="bf" data-v="${k}">${t}</button>`).join("")}</div></div>
  <div class="list">${list.map(b => `<div class="item" data-a="bill" data-m="${m}" data-id="${esc(b.hid)}"><div class="hno">${esc(b.no)}</div><div class="m"><b>${esc(b.owner || "—")}</b><small>Marla ${money(b.marlaCharge)} · Water ${money(b.water)} (${b.units} u)${num(b.arrears) ? " · Arrears " + money(b.arrears) : ""}${num(b.fine) ? " · Fine " + money(b.fine) : ""}${b.noReading ? " · no reading" : ""}${b.waSentAt ? " · ✓ sent on WhatsApp" : ""}</small></div><div><div class="amt">${money(b.total)}</div><div style="text-align:right">${badge(status(b))}</div></div></div>`).join("") || `<div class="empty">No bills</div>`}</div>`;
}

/* ---- Pending ---- */
function pendingList() {
  const out = [], months = billMonths().reverse();
  S.houses.forEach(h => {
    const m = months.find(mm => S.bills[mm].b && S.bills[mm].b[h.id]);
    if (!m) return; const b = S.bills[m].b[h.id];
    if (b.carried) return; const bal = balance(b);
    if (bal > 0) out.push({ h, m, b, bal });
  });
  return out.sort((a, b) => b.bal - a.bal);
}
function vPending() {
  const list = pendingList(), tot = list.reduce((s, x) => s + x.bal, 0);
  return proofsBlock() + `<div class="grid"><div class="stat"><span>Plots with dues</span><b>${list.length}</b></div><div class="stat"><span>Total outstanding</span><b style="color:var(--red)">${money(tot)}</b></div></div>
  <div class="list">${list.map(x => `<div class="item" data-a="bill" data-m="${x.m}" data-id="${esc(x.h.id)}"><div class="hno">${esc(x.h.no)}</div><div class="m"><b>${esc(x.h.owner || "—")}</b><small>${mLabel(x.m)} · Due ${fmtDate(S.bills[x.m].dueDate)}${num(x.b.arrears) > 0 ? " · includes arrears" : ""}</small></div><div><div class="amt" style="color:var(--red)">${money(x.bal)}</div><div style="text-align:right">${badge(status(x.b))}</div></div></div>`).join("") || `<div class="empty">No pending bills 🎉</div>`}</div>`;
}

/* ---- Settings ---- */

  <div class="card"><h2>Rates</h2><div class="f2">${fld("marlaRate", "Rate per marla (Rs)", "number", 'step="0.01" min="0"')}${fld("unitRate", "Water rate per unit (Rs)", "number", 'step="0.01" min="0"')}${fld("fineDefault", "Default late fine (Rs)", "number", 'step="1" min="0"')}${fld("dueDays", "Days until due date", "number", 'min="0"')}</div><p class="muted" style="margin:0;font-size:13px">New rates apply from the next bill run; existing bills are not changed.</p></div>
  <div class="card"><h2>JazzCash</h2><div class="f2">${fld("jazzNumber", "JazzCash number", "tel")}${fld("jazzTitle", "Account title")}</div></div>
  <div class="card"><h2>Bank account</h2><div class="f2">${fld("bankName", "Bank name")}${fld("bankTitle", "Account title")}${fld("bankAcc", "Account number")}${fld("iban", "IBAN")}</div></div>
  <div class="card"><h2>Payment QR code</h2><div class="row" style="align-items:flex-start;gap:14px"><img class="qrprev" id="qrimg" src="${s.qr ? esc(s.qr) : "data:image/gif;base64,R0lGODlhAQABAAAAACw="}" alt=""><div style="flex:1;min-width:180px"><input type="file" id="qrfile" accept="image/*"><p class="muted" style="font-size:13px">Upload a photo or screenshot of your JazzCash / Raast QR code. It is printed on every bill.</p>${s.qr ? '<button type="button" class="btn sm red" data-a="qrdel">Remove QR</button>' : ""}</div></div></div>
  <div class="card"><h2>Meter reader screen</h2>
  ${tg("readerShowPrev", "Show previous reading to the reader", "When off, the reader only sees the plot number and enters the new reading.")}
  ${tg("readerShowOwner", "Show owner name to the reader", "Helps the reader find the right house.")}
  <div class="row" style="margin-top:10px"><button type="button" class="btn" data-a="tab" data-v="logins">Manage logins (residents, readers, admins)</button></div></div>
  <div class="card"><h2>Bill buttons</h2><p class="muted" style="margin:0 0 10px;font-size:13px">Choose which buttons show on a bill for each login type. Untick a box to hide that button.</p>
  <table class="tbl" style="accent-color:var(--pri)"><tr><th>Button</th><th style="text-align:center">Admin</th><th style="text-align:center">Resident</th></tr>${BTNS.map(([k, label, a, r]) => `<tr><td>${label}</td><td style="text-align:center">${a ? `<input type="checkbox" name="btn_admin_${k}" ${bOn("admin", k) ? "checked" : ""}>` : "—"}</td><td style="text-align:center">${r ? `<input type="checkbox" name="btn_resident_${k}" ${bOn("resident", k) ? "checked" : ""}>` : "—"}</td></tr>`).join("")}</table>
  <p class="muted" style="margin:10px 0 0;font-size:13px">Admin settings apply to every admin login. You can always turn a button back on here.</p></div>
  <div class="card"><h2>Complaints staff rights</h2><p class="muted" style="margin:0 0 10px;font-size:13px">For "Complaints staff" logins (Logins → + Staff login). They only see the Inbox, never bills, payments to approve or settings. Complaints are always included when the Inbox is on.</p>
  ${SR.map(([k, label, sub]) => `<label class="toggle"><input type="checkbox" name="sr_${k}" ${sr(k) ? "checked" : ""}><span><b>${label}</b><small>${sub}</small></span></label>`).join("")}</div>
  </div><div class="row" style="margin-bottom:14px"><button class="btn pri">Save settings</button></div></form>
  <div class="card"><h2>Backup</h2><p class="muted" style="margin-top:0">Download all data (plots, readings, bills) as one JSON file.</p><button class="btn" data-a="backup">Download backup</button></div>`;
}

/* ---- READER ---- */
function viewReader() {
  const m = S.readMonth, { sold, list, doneN } = readingRows(m);

async function bulkLogins() {
  const todo = soldHouses().filter(h => !userOfHouse(h.id));
  if (!todo.length) return;
  if (!(await ask("Create " + todo.length + " logins?", "A login will be created for every sold plot that doesn't have one. The username is the plot number and the password is random. You'll get the full list at the end.", "Create"))) return;
  openModal(`<h3>Creating logins…</h3><div class="bar"><i id="pbar" style="width:0"></i></div><p class="muted" id="ptxt">0 / ${todo.length}</p>`);
  const out = [], fails = [];
  for (let i = 0; i < todo.length; i++) {
    const h = todo[i];
    try { const c = await D.createLogin("resident", cleanUser(h.no), genPassword(), h.id, h.owner); out.push(Object.assign(c, { h })); }
    catch (e) { fails.push(h.no + ": " + (e.message || e.code)); if (/too-many/.test(e.code || "")) { fails.push("Stopped: Firebase limit reached. Try the rest again in an hour."); break; } }

    await new Promise(r => setTimeout(r, 250));
  }
  if (out.length) credModal(out); else closeModal();
  if (fails.length) toast(fails.length + " failed: " + fails[0]);
}

function replyTopic(hid) {
  const last = S.msgs.filter(m => m.hid === hid && m.from === "resident").sort(byAt).pop();

async function sendMsgForm(f) {
  const admin = isOffice(), hid = S.chat; if (!hid) return;
  const fd = new FormData(f); const kind = admin ? "message" : String(fd.get("kind") || "message");
  const text = String(fd.get("text") || "").trim(); const file = f.shot.files[0];
  const amount = kind === "payment" ? num(fd.get("amount")) : 0, tid = kind === "payment" ? String(fd.get("tid") || "").trim() : "";
  if (kind === "payment" && amount <= 0) return toast("Enter the amount you paid");
  if (kind === "payment" && !file && !tid) return toast("Attach the payment screenshot or enter the TID");
  if (!text && !file && kind !== "payment") return toast("Write a message or attach a photo");
  const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Sending…";
  const image = file ? await shrinkImage(file) : "";
  const at = new Date().toISOString();
  const m = { hid, uid: S.uid, from: admin ? "admin" : "resident", kind, topic: admin ? replyTopic(hid) : kind, text, image, at, seenByAdmin: admin, seenByResident: !admin };
  if (admin) { m.by = S.me.name || S.me.username || ""; m.byRole = S.me.role; }
  if (kind === "complaint") m.status = "open";
  const ok = await write(async () => {
    if (kind === "payment") {
      const method = String(fd.get("method") || "JazzCash"), date = String(fd.get("date") || todayISO());
      const cur = billMonths().reverse().map(mm => S.bills[mm].b[hid]).find(b => b && !b.carried);
      const pid = D.newProofId();
      await D.createProofWithId(pid, { hid, uid: S.uid, month: cur ? cur.month : curMonth(), amount, method, tid, date, note: text, image, status: "pending", createdAt: at });
      Object.assign(m, { proofId: pid, amount, method, tid });
    }
    await D.sendMsg(m);
  });
  if (ok) { f.reset(); const pf = $("#payf"); if (pf) pf.style.display = "none"; toast(kind === "payment" ? "Payment sent for confirmation" : "Sent"); }
  btn.disabled = false; btn.textContent = "Send";
}

async function shrinkImage(file, mx = 1100, q = 0.72) {

  const img = await loadImg(url); if (!img) return "";
  const sc = Math.min(1, mx / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  let d = c.toDataURL("image/jpeg", q); if (d.length > 700000) d = c.toDataURL("image/jpeg", 0.5);
  return d;
}

/* ---- bills ---- */
async function generateBills(m, dueDate) {
  const s = st(); const sold = soldHouses();
  const months = billMonths(); if (months.some(x => x > m)) return toast("Bills for a later month already exist");
  const prevM = months.filter(x => x < m).pop(); const prev = prevM ? S.bills[prevM] : null;
  const ex = S.bills[m];
  const b = {};
  sold.forEach(h => {
    const e = ex && ex.b && ex.b[h.id]; const pb = prev && prev.b && prev.b[h.id];
    const hadBill = months.some(mm => mm < m && S.bills[mm].b && S.bills[mm].b[h.id]);
    const arrears = pb ? balance(pb) : (hadBill ? 0 : num(h.prevBal));
    const prevR = prevReading(h, m), cur = readingOf(h.id, m), noReading = cur == null;
    const units = noReading ? 0 : Math.max(0, r2(cur - prevR));
    const marlaRate = e ? num(e.marlaRate) : num(s.marlaRate), unitRate = e ? num(e.unitRate) : num(s.unitRate);
    const marlaCharge = r2(num(h.marla) * marlaRate), water = r2(units * unitRate), fine = e ? num(e.fine) : 0;
    b[h.id] = { hid: h.id, no: h.no, street: h.street || "", code: h.code || "", owner: h.owner || "", phone: h.phone || "", marla: num(h.marla), meter: h.meter || "", marlaRate, unitRate, marlaCharge, prev: prevR, curr: noReading ? null : cur, units, water, arrears, fine, total: r2(marlaCharge + water + arrears + fine), paid: e ? num(e.paid) : 0, payments: e ? (e.payments || []) : [], noReading };
  });
  const ok = await write(async () => {
    await D.saveBillRun(m, { month: m, generatedAt: (ex && ex.generatedAt) || new Date().toISOString(), dueDate }, b, prevM, prev ? Object.keys(b).filter(id => prev.b[id]) : []);
  });
  if (ok) { S.billMonth = m; toast(Object.keys(b).length + " bills generated"); }
}

    let ph = String(g("phone") ?? "").trim(), ph2 = String(g("phone2") ?? "").trim();
    const parts = ph.split(/\s+(?=\d)/); if (parts.length > 1 && !ph2) { ph = parts[0]; ph2 = parts.slice(1).join(" "); }
    out.push({ no, street: String(g("street") ?? "").trim(), marla: num(g("area")), code: String(g("code") ?? "").trim(), owner: cleanName(g("owner")), phone: ph, phone2: ph2, prevBal: num(g("bal")), meter: String(g("meter") ?? "").trim(), opening: num(g("opening")) });
  }
  return out;
}
async function importExcel(file) {
  openModal(`<h3>Reading Excel file…</h3>`);
  let X; try { X = await loadXlsx(); } catch (e) { openModal(`<h3>Could not load the Excel reader<button class="x" data-a="close">×</button></h3><p>Check your internet connection and try again.</p>`); return; }
  const wb = X.read(await file.arrayBuffer(), { type: "array" });
  let rows = null, sheet = "";
  for (const n of wb.SheetNames) { const r = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }); const p = parseProfile(r); if (p && p.length) { rows = p; sheet = n; break; } }
  if (!rows) { openModal(`<h3>No plot data found<button class="x" data-a="close">×</button></h3><p>The sheet needs columns such as "PLOT NAME", "AREA", "Owner" and "MOBILE 1".</p>`); return; }
  const byNo = new Map(S.houses.map(h => [String(h.no), h]));
  const nNew = rows.filter(r => !byNo.has(r.no)).length;
  S.pendingImport = rows;
  openModal(`<h3>Import from Excel<button class="x" data-a="close">×</button></h3>
  <p>Found <b>${rows.length}</b> plots on sheet <b>${esc(sheet)}</b>: ${rows.length - nNew} already in the list (will be updated), ${nNew} new.</p>
  <label class="toggle"><input type="radio" name="imode" value="merge" checked><span><b>Merge</b><small>Update and add the plots from Excel; keep everything else.</small></span></label>
  <label class="toggle" style="margin-bottom:14px"><input type="radio" name="imode" value="replace"><span><b>Replace</b><small>Remove the current list and keep only the plots from Excel.</small></span></label>
  <p class="muted" style="font-size:13px">All imported plots are marked as sold. Bills and readings are not affected.</p>
  <button class="btn pri block" data-a="importGo">Import</button>`);
}
async function applyImport(mode) {
  const rows = S.pendingImport || []; if (!rows.length) return;
  const list = mode === "replace" ? [] : S.houses.map(h => Object.assign({}, h));
  rows.forEach(r => {
    const i = list.findIndex(h => String(h.no) === r.no);
    const rec = { no: r.no, street: r.street, marla: r.marla, code: r.code, owner: r.owner, phone: r.phone, phone2: r.phone2, prevBal: r.prevBal, sold: true };
    if (r.meter) rec.meter = r.meter; if (r.opening) rec.opening = r.opening;
    if (i >= 0) list[i] = Object.assign({}, list[i], rec);
    else { const old = S.houses.find(h => String(h.no) === r.no); let id = old ? old.id : hidFor(r.no); while (list.some(h => h.id === id)) id += "_"; list.push(Object.assign({ id, meter: "", opening: 0 }, rec)); }
  });
  if (await write(async () => { await D.saveHouses(list); if (!S.settingsExists) await D.saveSettings(st()); })) { closeModal(); S.pendingImport = null; toast(rows.length + " plots imported"); }
}

document.addEventListener("input", e => {

});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.closest("#app form[data-f]")) S.dirty = true;
  if (t.id === "rm") { if (t.value) { S.readMonth = t.value; render(true); } }
  else if (t.id === "bm") { S.billMonth = t.value; S.q = ""; render(true); }
  else if (t.id === "newchat") { if (t.value) chatModal(t.value); t.value = ""; }
  else if (t.name === "kind" && t.closest("form[data-f=msg]")) { const pf = $("#payf"); if (pf) pf.style.display = t.value === "payment" ? "" : "none"; }
  else if (t.id === "qrfile" && t.files[0]) {
    const f = t.files[0]; const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    const img = await loadImg(url); if (!img) return toast("Could not open that image");
    const mx = 600, sc = Math.min(1, mx / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    let d = c.toDataURL("image/png"); if (d.length > 180000) d = c.toDataURL("image/jpeg", 0.85);
    if (await write(() => D.saveSettings(Object.assign({}, st(), { qr: d })))) { const im = $("#qrimg"); if (im) im.src = d; toast("QR code saved"); }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, k = f.dataset.f, fd = new FormData(f); S.dirty = false;
  if (k === "login") {
    const btn = f.querySelector("button"); btn.disabled = true; $("#lerr").innerHTML = "";
    try { await login(fd.get("u"), String(fd.get("p") || "")); } catch (err) { $("#lerr").innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; }
  } else if (k === "bootstrap") {
    const btn = f.querySelector("button"); btn.disabled = true;
    try { await bootstrapAdmin(fd.get("u"), String(fd.get("p") || ""), String(fd.get("name") || "").trim()); } catch (err) { toast(err.message || "Could not create the account"); btn.disabled = false; }
  } else if (k === "newLogin") {
    const h = S.houses.find(x => x.id === f.dataset.id); const btn = f.querySelector("button"); btn.disabled = true;
    try { const c = await D.createLogin("resident", fd.get("u"), String(fd.get("p") || ""), h.id, h.owner); credModal([Object.assign(c, { h })]); } catch (err) { toast(err.message || "Could not create the login"); btn.disabled = false; }
  } else if (k === "staffLogin") {
    const btn = f.querySelector("button"); btn.disabled = true;
    try { const c = await D.createLogin(fd.get("role"), fd.get("u"), String(fd.get("p") || ""), null, String(fd.get("name") || "").trim()); credModal([c]); } catch (err) { toast(err.message || "Could not create the login"); btn.disabled = false; }
  } else if (k === "msg") { sendMsgForm(f);
  } else if (k === "proof") {
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Submitting…";
    const file = f.shot.files[0]; let image = ""; if (file) image = await shrinkImage(file);
    const p = { hid: S.me.hid, uid: S.uid, month: f.dataset.m, amount: num(fd.get("amount")), method: String(fd.get("method")), tid: String(fd.get("tid") || "").trim(), date: String(fd.get("date") || todayISO()), note: String(fd.get("note") || "").trim(), image, status: "pending", createdAt: new Date().toISOString() };
    if (p.amount <= 0) { toast("Enter the amount"); btn.disabled = false; btn.textContent = "Submit payment"; return; }
    if (await write(() => D.createProof(p))) { closeModal(); toast("Thank you! Your payment has been sent for confirmation."); } else { btn.disabled = false; btn.textContent = "Submit payment"; }
  } else if (k === "waPick") {
    const m = S.billMonth; let rows = Object.values(S.bills[m].b).sort((x, y) => hsort({ no: x.no }, { no: y.no }));
    const mode = fd.get("mode");
    if (mode === "notsent") rows = rows.filter(b => !b.waSentAt);
    else if (mode === "unpaid") rows = rows.filter(b => balance(b) > 0);
    else if (mode === "range") { let a1 = +fd.get("from"), a2 = +fd.get("to"); if (a1 > a2) [a1, a2] = [a2, a1]; rows = rows.slice(a1, a2 + 1); }
    else if (mode === "custom") { const set = new Set(String(fd.get("custom") || "").split(/[,\s]+/).filter(Boolean).map(x => x.toLowerCase())); rows = rows.filter(b => set.has(String(b.no).toLowerCase())); }
    if (fd.get("skipNoPhone")) rows = rows.filter(b => waPhone(b.phone));
    startWa(m, rows);
  } else if (k === "chpw") {
    if (fd.get("n1") !== fd.get("n2")) return toast("The new passwords don't match");
    if (String(fd.get("n1")).length < 6) return toast("The new password must be at least 6 characters");
    try { await D.changeOwnPassword(String(fd.get("old")), String(fd.get("n1"))); closeModal(); toast("Password changed"); } catch (err) { toast(/wrong|invalid|credential/i.test(err.code || "") ? "Current password is incorrect" : "Could not change the password"); }
  } else if (k === "setup") {
    const total = Math.min(2000, Math.max(1, Math.round(num(fd.get("total"))))), marla = num(fd.get("marla"));
    const sold = parseRanges(fd.get("sold"));
    const list = []; for (let i = 1; i <= total; i++) list.push({ id: String(i), no: String(i), owner: "", phone: "", marla, meter: "", opening: 0, sold: sold.has(String(i)) });
    const s = Object.assign({}, st(), { name: String(fd.get("name") || DEF.name), marlaRate: num(fd.get("marlaRate")), unitRate: num(fd.get("unitRate")) });
    const ok = await write(async () => { await D.saveSettings(s); if (!S.housesExists) await D.saveHouses(list); });
    if (ok) { toast("Setup complete"); S.view = "houses"; render(true); }
  } else if (k === "settings") {
    const s = Object.assign({}, st());
    ["name", "address", "phone", "jazzNumber", "jazzTitle", "bankName", "bankTitle", "bankAcc", "iban"].forEach(n => s[n] = String(fd.get(n) || "").trim());
    ["marlaRate", "unitRate", "fineDefault", "dueDays"].forEach(n => s[n] = num(fd.get(n)));
    s.readerShowPrev = !!fd.get("readerShowPrev"); s.readerShowOwner = !!fd.get("readerShowOwner");
    s.staffRights = {}; SR.forEach(([k]) => { s.staffRights[k] = !!fd.get("sr_" + k); });
    s.btns = { admin: {}, resident: {} }; BTNS.forEach(([k, , a, r]) => { if (a) s.btns.admin[k] = !!fd.get("btn_admin_" + k); if (r) s.btns.resident[k] = !!fd.get("btn_resident_" + k); });
    if (await write(() => D.saveSettings(s))) toast("Settings saved");
  } else if (k === "house") saveHouse(f);
  else if (k === "reading") saveReading(f, (e.submitter && e.submitter.value) || "next");
  else if (k === "pay") savePay(f);
  else if (k === "fine") { const m = f.dataset.m, id = f.dataset.id; const amt = num(fd.get("amt")); if (amt <= 0) return; if (await setFine(m, id, num(S.bills[m].b[id].fine) + amt)) { toast("Fine added"); setTimeout(() => billModal(m, id), 150); } }
  else if (k === "bulkFine") {
    const m = S.billMonth, amt = num(fd.get("amt")); if (amt <= 0) return; const u = {};
    Object.values(S.bills[m].b).forEach(b => { if (balance(b) > 0 && !num(b.fine)) u[b.hid] = { fine: amt, total: r2(num(b.total) + amt) }; });
    if (await write(() => D.updateBills(m, u))) { closeModal(); toast("Fine added to " + Object.keys(u).length + " bills"); }
  } else if (k === "bulkSold") {
    const set = parseRanges(fd.get("nos")), v = fd.get("v") === "1"; if (!set.size) return toast("Enter plot numbers");
    let n = 0; const list = S.houses.map(h => { if (set.has(String(h.no))) { n++; return Object.assign({}, h, { sold: v }); } return h; });
    if (await write(() => D.saveHouses(list))) { closeModal(); toast(n + " plots updated"); }
  }
});
